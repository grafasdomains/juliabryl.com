<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Julia Bryl — Makeup Artist</title>

    <meta
        name="description"
        content="Julia Bryl — makeup artist and World Champion at the international contest in Las Vegas in 2002."
    >

    <link rel="canonical" href="https://juliabryl.com/">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            color: #222222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 60px 24px;
        }

        main {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        .logo {
            display: block;
            width: 130px;
            height: auto;
            margin: 0 auto 32px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.2;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .description {
            margin: 20px auto 28px;
            max-width: 560px;

            font-size: 17px;
            line-height: 1.7;
            color: #555555;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #dddddd;
            margin: 0 auto 28px;
        }

        .instagram {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 44px;
            height: 44px;

            color: #222222;
            text-decoration: none;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .instagram:hover {
            color: #c13584;
            transform: translateY(-2px);
        }

        .instagram svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        @media (max-width: 600px) {
            body {
                padding: 40px 20px;
            }

            .logo {
                width: 110px;
                margin-bottom: 26px;
            }

            h1 {
                font-size: 26px;
            }

            .description {
                font-size: 16px;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>

<main>
    <img
        src="./css/logo.png"
        width="130"
        alt="Julia Bryl"
        class="logo"
    >

    <h1>Julia Bryl — makeup artist</h1>

    <p class="description">
        World Champion at the international contest in Las Vegas in 2002.
    </p>

    <div class="divider"></div>

    <a
        href="https://www.instagram.com/juliabryl_makeup/"
        class="instagram"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Julia Bryl on Instagram"
    >
        <svg
            viewBox="0 0 448 512"
            aria-hidden="true"
        >
            <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
        </svg>
    </a>
</main>

</body>
</html>
